<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bullpen{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['JetBrains Mono', 'monospace'],
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        ink: { 50: '#f7f7f8', 100: '#eeeef0', 200: '#d9d9de', 300: '#b8b8c1', 400: '#91919f', 500: '#737382', 600: '#5d5d6a', 700: '#4c4c56', 800: '#414149', 900: '#39393f', 950: '#18181b' },
                    }
                }
            }
        }
    </script>
    <style>
        /* htmx loading indicators */
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-flex; }
        .htmx-request .htmx-hide-on-request { display: none; }

        .log-viewer {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .agent-status { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.05em; }
    </style>
</head>
<body class="bg-ink-950 text-ink-100 min-h-screen font-sans">
    <nav class="border-b border-ink-800/50 bg-ink-950/80 backdrop-blur-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 h-14 flex items-center justify-between">
            <div class="flex items-center gap-8">
                <a href="/" class="flex items-center gap-2 group">
                    <span class="text-lg font-semibold tracking-tight">bullpen</span>
                    <span class="text-[10px] font-mono text-ink-500 group-hover:text-ink-400">v0.1</span>
                </a>
                <div class="flex items-center gap-1" hx-get="/partials/nav" hx-trigger="every 5s" hx-swap="innerHTML">
                    {% include "partials/nav.html" %}
                </div>
            </div>
            <div hx-get="/partials/status" hx-trigger="every 2s" hx-swap="innerHTML">
                {% if loop_status %}{% include "partials/status.html" %}{% endif %}
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
